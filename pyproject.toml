[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailcloud-sdk"
version = "0.1.0"
description = "TailCloud SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "TailCloud" }
]

dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tailcloud_sdk = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
